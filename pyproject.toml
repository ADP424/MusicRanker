[project]
name = "music_ranker"
version = "0.1.0"
requires-python = ">=3.12"
# Pinned versions live in requirements.txt / requirements-dev.txt; keep these lists in step.
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
    "requests",
    "argon2-cffi",
    "email-validator",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
